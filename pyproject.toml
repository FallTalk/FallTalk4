[project]
name = "falltalk"
version = "4.0.0"
description = "Multi-engine text-to-speech application"
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- PyTorch ecosystem ---
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    "torchtext==0.18.0",
    "torchmetrics",
    "torchcrepe>=0.0.2",
    "torchfcpe",
    "torchlibrosa",
    "torchdiffeq==0.2.5",
    "torchsde",
    "torchtune",
    "torchao",
    "pytorch-lightning",
    "xformers>=0.0.30",
    "triton-windows<3.4",
    "deepspeed==0.16.5",
    "bitsandbytes",
    "faiss-cpu",

    # --- ML / Transformers ---
    "transformers>=4.55.0",
    "transformers_stream_generator",
    "diffusers",
    "safetensors",
    "datasets",
    "peft",
    "accelerate",
    "sentencepiece",
    "einops",
    "einops_exts",
    "x-transformers",
    "local_attention>=1.11.1",
    "ema_pytorch>=0.5.2",
    "vector_quantize_pytorch",
    "timm",
    "ftfy",
    "wandb",

    # --- TTS Engines (formerly submodules) ---
    "f5-tts>=1.1.17",
    "chatterbox-tts>=0.1.6",
    "nari-tts @ git+https://github.com/nari-labs/dia.git",
    "orpheus-speech>=0.1.0",
    "fish-speech @ git+https://github.com/fishaudio/fish-speech.git",
    "boson_multimodal @ git+https://github.com/boson-ai/higgs-audio.git",

    # --- Speech / Audio ---
    "whisperx>=3.3.2",
    "faster-whisper>=1.1.1",
    "librosa>=0.11.0",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "pydub",
    "av>=14.3.0",
    "praat-parselmouth==0.4.5",
    "pesq",
    "pystoi",
    "noisereduce",
    "demucs",
    "encodec",
    "julius",
    "vocos",
    "snac",
    "descript-audio-codec",
    "descript-audiotools==0.7.2",
    "phonemizer",
    "edge-tts==7.2.1",
    "elevenlabs",
    "qwen-tts",
    "sox",
    "resemble-perth",
    "s3tokenizer",
    "conformer",

    # --- NLP / Text processing ---
    "nltk==3.9.1",
    "spacy>=3.7.5",
    "num2words",
    "unidecode",
    "g2p_en",
    "pypinyin",
    "pyopenjtalk",
    "cn2an",
    "hangul_romanize",
    "word2number",
    "wordsegment",
    "LangSegment>=0.2.0",
    "fast_langdetect",
    "split_lang",
    "jieba",
    "jieba_fast",
    "funasr==1.2.6",
    "unidic-lite>=1.0.8",

    # --- Inference / Runtime ---
    "onnxruntime-gpu==1.21.1",
    "onnx==1.18.0",
    "ctranslate2",
    "nvidia-cudnn-cu12<9; sys_platform == 'win32'",
    "causal_conv1d",
    "mamba-ssm",
    "flash-attn",
    "exllamav2",
    "monotonic_align",

    # --- GUI ---
    "imgui-bundle>=1.6.0",     # imgui + hello_imgui + imguizmo

    # --- API / Web ---
    "fastapi",
    "uvicorn>=0.29.0",
    "pydantic==2.11.3",

    # --- Hugging Face ---
    "huggingface_hub>=0.34.4",
    "hf_xet",
    "modelscope==1.17.1",

    # --- Audio / Video utilities ---
    "python-ffmpeg==2.0.12",
    "ffmpeg-python",

    # --- Scientific / Numeric ---
    "numpy>=2.0.2",
    "scipy",
    "numba==0.61.2",

    # --- Config / Utilities ---
    "hydra-core>=1.3.2",
    "hydra_colorlog",
    "fairseq @ git+https://github.com/facebookresearch/fairseq.git@v0.12.2",
    "flashy==0.0.2",
    "munch",
    "dacite",
    "protobuf>=6.31.1",
    "python-Levenshtein>=0.25.1",
    "chardet<6",
    "PyYAML",
    "psutil",
    "tensorboard",
    "tqdm>=4.66.5",
    "pip-system-certs",

    # --- Build / Platform ---
    "setuptools<81",
    "wheel",
    "pywin32==308",
]

[project.scripts]
falltalk = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src", "main.py"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
# faiss-cpu is only available via conda-forge; install separately if needed:
#   uv pip install faiss-cpu
# ffmpeg must be installed via system package manager or conda

# descript-audiotools pins protobuf<3.20, which conflicts with our protobuf>=6.31.1
override-dependencies = [
    "protobuf>=6.31.1",
    # fairseq 0.12.2 has legacy hydra/omegaconf upper bounds; keep the app on the newer stack we already use
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # Replace Linux-only triton with triton-windows when pulled as transitive dep
    "triton; sys_platform != 'win32'",
    # Lock torch stack — dia/chatterbox/fish-speech all pin different versions
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    # chatterbox pins numpy<1.26.0 which conflicts with our >=2.0.2
    "numpy>=2.0.2",
    # orpheus-speech hard-deps vllm and snac; vllm is Linux-only
    "vllm; sys_platform != 'win32'",
    # fish-speech pins pydantic==2.9.2, we need 2.11.3
    "pydantic==2.11.3",
    # chatterbox-tts pins transformers==4.46.3, we need >=4.55.0
    "transformers>=4.55.0",
    # chatterbox-tts/f5-tts pull in conflicting gradio versions; we don't use the web UI
    "gradio; python_version == '0'",
    # Lock versions being downgraded by TTS engine deps (f5-tts, chatterbox, fish-speech, modelscope)
    "triton-windows>=3.3.1.post21; sys_platform == 'win32'",
    "x-transformers>=2.17.4",
    "datasets>=4.8.3",
    "diffusers>=0.37.0",
    "vector-quantize-pytorch>=1.27.21",
    "safetensors>=0.7.0",
    "fsspec>=2026.2.0",
    "rich>=14.3.3",
    "dill>=0.4.1",
    "einx>=0.4.2",
    "multiprocess>=0.70.19",
    # requests 2.32.x requires chardet<6
    "chardet<6"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

causal_conv1d = { url = "https://huggingface.co/falltalk/falltalk4/resolve/main/wheels/causal_conv1d-1.5.0.post8-cp311-cp311-win_amd64.whl" }
mamba-ssm = { url = "https://huggingface.co/falltalk/falltalk4/resolve/main/wheels/mamba_ssm-2.2.4-cp311-cp311-win_amd64.whl" }
flash-attn = { url = "https://github.com/kingbri1/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu128torch2.7.0cxx11abiFALSE-cp311-cp311-win_amd64.whl" }
exllamav2 = { url = "https://github.com/turboderp-org/exllamav2/releases/download/v0.2.9/exllamav2-0.2.9+cu128.torch2.7.0-cp311-cp311-win_amd64.whl" }
monotonic_align = { git = "https://github.com/resemble-ai/monotonic_align.git" }
